<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Car - O DJ da Viagem</title>
  <link rel="icon" type="image/png" href="/imgs/logo_Favicon.png">  
 
  <style>
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    
    .logo {
      max-width: 150px;
      margin-top: 20px;
      margin-bottom: 30px;
      display: block;
    }

    .card {
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    
    h2 {
      font-size: 1.5rem;
      margin-top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .pointed-finger {
      font-size: 2.5rem;
      transform: rotate(-15deg);
      display: inline-block;
    }

    p {
      color: #aaaaaa;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .limit-display {
      color: #1DB954;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .limit-reached {
      color: #e74c3c;
      font-weight: bold;
      margin-bottom: 15px;
      display: none;
    }

    /* Nova classe para exibir o sucesso direto na tela */
    .success-msg {
      color: #1DB954;
      font-weight: bold;
      margin-bottom: 15px;
      display: none;
      background-color: #121212;
      border: 1px solid #1DB954;
      padding: 10px;
      border-radius: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #121212;
      color: #ffffff;
      font-size: 1rem;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #1DB954;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }

    li {
      background-color: #121212;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background-color 0.2s;
    }

    li:hover {
      background-color: #222222;
    }

    li img {
      width: 50px;
      height: 50px;
      border-radius: 4px;
      margin-right: 15px;
    }

    .song-info {
      flex: 1;
    }

    .song-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .song-artist {
      color: #aaaaaa;
      font-size: 0.85rem;
    }

    .loading {
      color: #aaaaaa;
      font-size: 0.9rem;
      display: none;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <img class="logo" src="imgs/logo_Music-Car-dark.png" alt="Logo Music-Car">

  <div class="card">
    <h2><span class="pointed-finger">🫵🏼</span> é o 🎧 DJ da Viagem</h2>
    <p>Busque e escolha uma música para entrar direto na fila do carro!</p>
    
    <!-- Local onde a mensagem de sucesso vai aparecer -->
    <div id="success-msg" class="success-msg"></div>
    <div id="limit-reached-msg" class="limit-reached">Limite de 2 músicas atingido para esta corrida! 🚗💨</div>
    <div id="limit-msg" class="limit-display">Você pode enviar mais 2 músicas nesta corrida.</div>

    <input type="text" id="search" placeholder="Digite o nome da música ou artista..." autocomplete="off">
    <div id="loading" class="loading">Buscando...</div>
    <ul id="results"></ul>
  </div>

  <script>
    const limitMsg = document.getElementById('limit-msg');
    const limitReachedMsg = document.getElementById('limit-reached-msg');
    const successMsg = document.getElementById('success-msg');
    const searchInput = document.getElementById('search');
    const resultsList = document.getElementById('results');
    const loading = document.getElementById('loading');

    const MAX_SONGS = 2;
    let songsAdded = parseInt(localStorage.getItem('songsAdded')) || 0;
    let debounceTimer;

    function updateLimitUI() {
      if (songsAdded >= MAX_SONGS) {
        limitMsg.style.display = 'none';
        limitReachedMsg.style.display = 'block';
        searchInput.disabled = true;
        searchInput.placeholder = "Limite atingido!";
        resultsList.innerHTML = '';
      } else {
        const remaining = MAX_SONGS - songsAdded;
        limitMsg.textContent = `Você pode enviar mais ${remaining} música${remaining > 1 ? 's' : ''} nesta corrida.`;
      }
    }

    updateLimitUI();

    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();
      
      if (query.length < 3) {
        resultsList.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(() => searchSongs(query), 500);
    });

    async function searchSongs(query) {
      loading.style.display = 'block';
      resultsList.innerHTML = '';
      successMsg.style.display = 'none';
      
      try {
        const res = await fetch(`/api/proxy?action=search&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        if (data.tracks && data.tracks.items.length > 0) {
          data.tracks.items.forEach(track => {
            const li = document.createElement('li');
            const img = track.album.images.length > 0 ? track.album.images[0].url : '';
            const artistName = track.artists.map(a => a.name).join(', ');
            
            li.innerHTML = `
              <img src="${img}" alt="Capa">
              <div class="song-info">
                <div class="song-title">${track.name}</div>
                <div class="song-artist">${artistName}</div>
              </div>
            `;
            li.onclick = () => addToQueue(track.uri, track.name);
            resultsList.appendChild(li);
          });
        } else {
          resultsList.innerHTML = '<p style="color: #aaaaaa; margin-top: 15px;">Nenhuma música encontrada.</p>';
        }
      } catch (error) {
        console.error('Erro na busca:', error);
        resultsList.innerHTML = '<p style="color: #e74c3c; margin-top: 15px;">Erro ao buscar músicas.</p>';
      } finally {
        loading.style.display = 'none';
      }
    }

    async function addToQueue(uri, name) {
      if (songsAdded >= MAX_SONGS) return;

      // Adiciona um feedback temporário na lista para mostrar que a ação iniciou
      const tempLoading = document.createElement('li');
      tempLoading.innerHTML = '<div class="song-info"><div class="song-title">Adicionando à fila...</div></div>';
      resultsList.insertBefore(tempLoading, resultsList.firstChild);

      try {
        const res = await fetch('/api/proxy', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ uri: uri })
        });
        
        if (res.ok) {
          songsAdded++;
          localStorage.setItem('songsAdded', songsAdded);
          updateLimitUI();
          
          // Renderiza o sucesso na própria tela
          successMsg.innerHTML = `Sucesso! "${name}" entrou na fila 🚀<br><span style="font-size: 0.8rem; font-weight: normal; color: #aaaaaa;">Deixe o Spotify aberto no celular!</span>`;
          successMsg.style.display = 'block';
          
          searchInput.value = '';
          resultsList.innerHTML = '';
          
          // Oculta a mensagem depois de alguns segundos
          setTimeout(() => {
            successMsg.style.display = 'none';
          }, 6000);
        } else {
          tempLoading.remove();
          successMsg.innerHTML = '<span style="color: #e74c3c;">Erro ao adicionar. Certifique-se de que o Spotify está tocando algo no painel.</span>';
          successMsg.style.display = 'block';
        }
      } catch (error) {
        console.error('Erro ao adicionar:', error);
        tempLoading.remove();
        successMsg.innerHTML = '<span style="color: #e74c3c;">Erro de conexão. Tente novamente.</span>';
        successMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>

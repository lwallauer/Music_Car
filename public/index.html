<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ do Uber - Escolha sua Trilha</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #181818;
            --spotify-green: #1DB954;
            --text: #ffffff;
            --gray: #b3b3b3;
            --error: #ff5555;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--surface);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: center;
        }
        h1 { font-size: 20px; margin-bottom: 6px; }
        p { color: var(--gray); font-size: 13px; margin-bottom: 16px; line-height: 1.4; }
        
        .counter {
            font-size: 12px;
            color: var(--spotify-green);
            margin-bottom: 16px;
            background: rgba(29, 185, 84, 0.1);
            padding: 8px;
            border-radius: 6px;
        }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #282828;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--spotify-green); }

        .results {
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 16px;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #222;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .track-item:hover { background: #2a2a2a; }
        .track-item img {
            width: 45px;
            height: 45px;
            border-radius: 4px;
            margin-right: 12px;
        }
        .track-info {
            overflow: hidden;
        }
        .track-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 12px;
            color: var(--gray);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #status { font-size: 13px; min-height: 20px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎧 DJ da Viagem</h1>
        <p>Busque e escolha uma música para entrar direto na fila do carro!</p>
        
        <div class="counter" id="counterText">Você pode enviar mais 2 músicas nesta corrida.</div>

        <div id="searchContainer">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Digite o nome da música ou artista..." autocomplete="off">
            </div>
            <div class="results" id="resultsList"></div>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        const STORAGE_KEY = 'uber_dj_songs_sent';
        const MAX_SONGS = 2;

        function getSongsSent() {
            return parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
        }

        function updateCounterUI() {
            const sent = getSongsSent();
            const remaining = MAX_SONGS - sent;
            const counterEl = document.getElementById('counterText');
            const searchContainer = document.getElementById('searchContainer');

            if (remaining > 0) {
                counterEl.textContent = `Você pode enviar mais ${remaining} ${remaining === 1 ? 'música' : 'músicas'} nesta corrida.`;
            } else {
                counterEl.textContent = "Limite de 2 músicas atingido para esta corrida! 🚗💨";
                counterEl.style.color = "#ff5555";
                counterEl.style.background = "rgba(255, 85, 85, 0.1)";
                searchContainer.style.display = 'none';
            }
        }

        updateCounterUI();

        let searchTimeout;
        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const statusDiv = document.getElementById('status');

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();

            if (query.length < 3) {
                resultsList.innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(async () => {
                statusDiv.textContent = "Buscando músicas...";
                try {
                    const res = await fetch(`/api/proxy?action=search&q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    
                    resultsList.innerHTML = '';
                    statusDiv.textContent = '';

                    if (data.tracks && data.tracks.items.length > 0) {
                        data.tracks.items.forEach(track => {
                            const item = document.createElement('div');
                            item.className = 'track-item';
                            
                            const albumImg = track.album.images[2] ? track.album.images[2].url : '';
                            const artists = track.artists.map(a => a.name).join(', ');

                            item.innerHTML = `
                                <img src="${albumImg}" alt="Capa">
                                <div class="track-info">
                                    <div class="track-title">${track.name}</div>
                                    <div class="track-artist">${artists}</div>
                                </div>
                            `;

                            item.addEventListener('click', () => selectTrack(track.uri, track.name));
                            resultsList.appendChild(item);
                        });
                    } else {
                        statusDiv.textContent = "Nenhuma música encontrada.";
                    }
                } catch (err) {
                    statusDiv.textContent = "Erro ao buscar músicas.";
                    statusDiv.style.color = "var(--error)";
                }
            }, 400);
        });

        async function selectTrack(uri, trackName) {
            let sent = getSongsSent();
            if (sent >= MAX_SONGS) return;

            resultsList.innerHTML = '';
            searchInput.value = '';
            statusDiv.style.color = "var(--spotify-green)";
            statusDiv.textContent = `Adicionando "${trackName}" à fila...`;

            try {
                const res = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uri })
                });

                const data = await res.json();

                if (res.ok) {
                    sent++;
                    localStorage.setItem(STORAGE_KEY, sent);
                    statusDiv.textContent = `Sucesso! "${trackName}" entrou na fila 🚀`;
                    updateCounterUI();
                } else {
                    statusDiv.textContent = data.error || "Erro ao adicionar música.";
                    statusDiv.style.color = "var(--error)";
                }
            } catch (err) {
                statusDiv.textContent = "Erro de conexão com o servidor do carro.";
                statusDiv.style.color = "var(--error)";
            }
        }
    </script>
</body>
</html>
